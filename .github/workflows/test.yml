# Every pull request and every push to main runs the full checks: the site (built with Node.js:
# 26, as the Docker image does, and 24), the Rust server and updater, and both Docker images.
name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [26, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=high
  rust:
    # The Rust server and updater (rust/), which the Docker images run: their tests include running
    # the same work through the Node.js server and updater they replaced, and comparing every answer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci --no-audit --no-fund
      - name: Build the self-hosted site (both servers serve it in the comparison)
        run: VITE_COMMONVEIL_BACKEND=selfhost npx vite build --outDir dist-selfhost
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - name: Tests, and the comparison with the Node.js server
        working-directory: rust
        run: cargo test --locked
      - name: Lints (warnings are errors)
        working-directory: rust
        run: cargo clippy --locked --all-targets -- -D warnings
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the site image
        run: docker build -t commonveil:ci .
      - name: Build the updater image
        run: docker build -t commonveil-updater:ci -f updater/Dockerfile .
      - name: Both images have Alpine's zlib fix (1.4-r0 or later)
        run: |
          docker run --rm --entrypoint sh commonveil:ci -c 'apk list -I zlib || apk info -v zlib'
          docker run --rm --entrypoint sh commonveil-updater:ci -c 'apk list -I zlib || apk info -v zlib'
      - name: Neither image has Node.js
        run: |
          docker run --rm --entrypoint sh commonveil:ci -c '! command -v node'
          docker run --rm --entrypoint sh commonveil-updater:ci -c '! command -v node'
      - name: The updater has Docker and Compose, and won't start without a long enough token
        run: |
          docker run --rm --entrypoint sh commonveil-updater:ci -c 'docker --version && docker compose version'
          if docker run --rm commonveil-updater:ci; then echo "The updater started without UPDATER_TOKEN"; exit 1; fi
          docker run -d --name up -e UPDATER_TOKEN=a-token-for-the-ci-check-only-0123456789 commonveil-updater:ci
          sleep 3
          docker logs up 2>&1 | grep -q "Commonveil updater ready"
          test "$(docker inspect -f '{{.State.Running}}' up)" = true
          docker rm -f up
      - name: The site image starts and answers, as user 1000 (the same as before, so data stays readable)
        run: |
          docker run -d --name cv --network none commonveil:ci
          sleep 8
          docker exec cv commonveil-server version
          test "$(docker exec cv id -u)" = 1000
          docker exec cv wget -qO- http://127.0.0.1:8080/api/health
          docker exec cv wget -qO- http://127.0.0.1:8080/ | grep -q '<div id="root">'
          docker exec cv commonveil-server setup-code
          test "$(docker inspect -f '{{.State.Health.Status}}' cv)" != unhealthy
          docker rm -f cv
