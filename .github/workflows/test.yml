# Every pull request and every push to main runs the full checks: the site (built with Node.js:
# 26, as the Docker image does, and 24), the Rust server, updater and client core, the client core
# as WebAssembly, and both Docker images.
name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [26, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - run: npm audit --omit=dev --audit-level=high
  rust:
    # The Rust server and updater (rust/), which the Docker images run: their tests include running
    # the same work through the Node.js server and updater they replaced, and comparing every answer.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci --no-audit --no-fund
      - name: Build the self-hosted site (both servers serve it in the comparison)
        run: VITE_COMMONVEIL_BACKEND=selfhost npx vite build --outDir dist-selfhost
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - name: Tests, and the comparison with the Node.js server
        working-directory: rust
        run: cargo test --locked
      - name: Lints (warnings are errors)
        working-directory: rust
        run: cargo clippy --locked --all-targets -- -D warnings
  wasm:
    # The client core (rust/commonveil-client) as WebAssembly, as the browser app will load it:
    # built, measured, checked against the JavaScript copy of Secure Net the app uses today
    # (tests/wasmClient.test.mjs), and kept as an artifact. (Base44's backend functions can't load
    # WebAssembly at all: see rust/README.md, "The client core".)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci --no-audit --no-fund
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - name: wasm-bindgen (the command-line tool matching Cargo.lock)
        run: |
          version=$(awk '/name = "wasm-bindgen"/{getline; print $3}' rust/Cargo.lock | tr -d '"')
          cargo install --locked wasm-bindgen-cli --version "$version"
      - name: Build
        working-directory: rust
        run: |
          cargo build --locked --profile wasm --target wasm32-unknown-unknown -p commonveil-client
          for target in web nodejs; do
            wasm-bindgen --target "$target" --out-dir "../wasm-pkg/$target" target/wasm32-unknown-unknown/wasm/commonveil_client.wasm
          done
          # The Node.js build is CommonJS, and the repository's package.json says "module".
          echo '{ "type": "commonjs" }' > ../wasm-pkg/nodejs/package.json
      - name: Size
        run: |
          {
            echo "### Client core WebAssembly"
            echo "| Build | Bytes | Gzipped |"
            echo "| --- | --- | --- |"
            for f in wasm-pkg/*/*.wasm; do echo "| $f | $(wc -c < "$f") | $(gzip -9 -c "$f" | wc -c) |"; done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: The same answers as the JavaScript copy
        run: WASM_REQUIRED=1 node --test tests/wasmClient.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: commonveil-client-wasm
          path: wasm-pkg
          retention-days: 30
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the site image with the exact locked Secure Net revision
        run: |
          pinned=$(sed -n 's/^secure-net-core = .*rev = "\([0-9a-f]\{40\}\)".*/\1/p' rust/Cargo.toml)
          test "${#pinned}" -eq 40
          docker build --build-arg "SECURE_NET_REV=$pinned" -t commonveil:ci .
      - name: Build the updater image
        run: docker build -t commonveil-updater:ci -f updater/Dockerfile .
      - name: Both images have Alpine's zlib fix (1.4-r0 or later)
        run: |
          docker run --rm --entrypoint sh commonveil:ci -c 'apk list -I zlib || apk info -v zlib'
          docker run --rm --entrypoint sh commonveil-updater:ci -c 'apk list -I zlib || apk info -v zlib'
      - name: Docker image is labelled as experimental-transfer-disabled
        run: |
          label=$(docker image inspect commonveil:ci --format '{{ index .Config.Labels "org.opencontainers.image.secure-net.transfer" }}')
          test "$label" = experimental-disabled-by-default
          pinned=$(sed -n 's/^secure-net-core = .*rev = "\([0-9a-f]\{40\}\)".*/\1/p' rust/Cargo.toml)
          test "$(printf '%s' "$pinned" | wc -c)" -eq 40
          grep -q "$pinned" rust/Cargo.lock
          image_pinned=$(docker image inspect commonveil:ci --format '{{ index .Config.Labels "org.opencontainers.image.secure-net.commit" }}')
          test "$image_pinned" = "$pinned"
          # Confirm shipping Compose keeps the dangerous experimental staging switch OFF.
          SITE_DOMAIN=chat.example.org COMMONVEIL_DIR=/tmp/commonveil-ci UPDATER_TOKEN=test-only-token-not-real-123456789             docker compose -f deploy/docker-compose.yml config --format json             | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const c=JSON.parse(s); if(c.services.app.environment.EXPERIMENTAL_TRANSFER_STAGING!=="false" || c.services.app.environment.EXPERIMENTAL_RECIPIENT_CONSENT!=="false") process.exit(1)})'
      - name: Neither image has Node.js
        run: |
          docker run --rm --entrypoint sh commonveil:ci -c '! command -v node'
          docker run --rm --entrypoint sh commonveil-updater:ci -c '! command -v node'
      - name: The updater has Docker and Compose, and won't start without a long enough token
        run: |
          docker run --rm --entrypoint sh commonveil-updater:ci -c 'docker --version && docker compose version'
          if docker run --rm commonveil-updater:ci; then echo "The updater started without UPDATER_TOKEN"; exit 1; fi
          docker run -d --name up -e UPDATER_TOKEN=a-token-for-the-ci-check-only-0123456789 commonveil-updater:ci
          sleep 3
          docker logs up 2>&1 | grep -q "Commonveil updater ready"
          test "$(docker inspect -f '{{.State.Running}}' up)" = true
          docker rm -f up
      - name: The site image starts and answers, as user 1000 (the same as before, so data stays readable)
        run: |
          docker run -d --name cv --network none commonveil:ci
          sleep 8
          docker exec cv commonveil-server version
          test "$(docker exec cv id -u)" = 1000
          docker exec cv wget -qO- http://127.0.0.1:8080/api/health
          docker exec cv wget -qO- http://127.0.0.1:8080/ | grep -q '<div id="root">'
          docker exec cv commonveil-server setup-code
          test "$(docker inspect -f '{{.State.Health.Status}}' cv)" != unhealthy
          docker rm -f cv
  preview_image:
    # Deliberately opt-in development images, never stable :latest.
    # The successful test matrix is a prerequisite for publishing.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, rust, wasm, images]
    runs-on: ubuntu-latest
    concurrency:
      group: commonveil-preview-image
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Identify the pinned protocol
        id: protocol
        run: |
          revision=$(sed -n 's/^secure-net-core = .*rev = "\([0-9a-f]\{40\}\)".*/\1/p' rust/Cargo.toml)
          test "$(printf '%s' "$revision" | wc -c)" -eq 40
          echo "rev=$revision" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish CI-verified developer preview Docker app
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            COMMONVEIL_VERSION=${{ steps.protocol.outputs.version }}
            SECURE_NET_REV=${{ steps.protocol.outputs.rev }}
          tags: |
            ghcr.io/comutability/commonveil:edge
            ghcr.io/comutability/commonveil:edge-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.protocol.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish matching CI-verified developer preview updater
        uses: docker/build-push-action@v6
        with:
          context: .
          file: updater/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/comutability/commonveil-updater:edge
            ghcr.io/comutability/commonveil-updater:edge-${{ github.sha }}
