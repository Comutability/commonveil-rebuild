[workspace]
resolver = "2"
members = ["commonveil-server", "commonveil-updater", "commonveil-client"]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/Comutability/commonveil-rebuild"
rust-version = "1.88"

# Secure Net 0.7.0 with experimental SNIP-0007 transfer *draft* primitives.
# This is a reviewed-for-build but NOT standards-approved draft commit; staging stays off by default.
# The server and the client core both use it from here, and the OpenMLS copies below come from the
# same commit, always. The Secure Net workflow (.github/workflows/secure-net.yml) moves them together.
[workspace.dependencies]
secure-net-core = { git = "https://github.com/Comutability/secure-net", rev = "e82fd9e453f5c145e0f6e7892dd57e958db38ff2" }

# The client core as WebAssembly: small rather than fast to build. The server keeps the release profile.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Secure Net's OpenMLS copies (one added ciphersuite; see its rust/vendor/*/SECURE_NET_PATCH.md),
# from the same release: a dependency's own [patch] doesn't carry over.
[patch.crates-io]
openmls_traits = { git = "https://github.com/Comutability/secure-net", rev = "e82fd9e453f5c145e0f6e7892dd57e958db38ff2" }
openmls_rust_crypto = { git = "https://github.com/Comutability/secure-net", rev = "e82fd9e453f5c145e0f6e7892dd57e958db38ff2" }
