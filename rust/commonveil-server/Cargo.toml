[package]
name = "commonveil-server"
version = "0.24.0"
description = "The self-hosted Commonveil server, in Rust: replacing server/ and base44/shared stage by stage."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "time"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.23"
getrandom = "0.4"
regex = "1"
indexmap = "2"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
ed25519-dalek = "2"
unicode-normalization = "0.1"
url = "2"
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
aes-gcm = "0.10"
# Outgoing HTTPS: browser push services (and, later, other sites).
ureq = { version = "2", default-features = false, features = ["tls"] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
percent-encoding = "2"
# Realtime rooms on other sites (federation): WebSockets over TLS, with the same rustls (ring) and
# root certificates ureq already uses.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

# Secure Net (the protocol and Commonveil's cryptography), pinned to its 0.7.0 release.
secure-net-core = { git = "https://github.com/Comutability/secure-net", rev = "e3b1450d02a7ccfcf0a20f906afbcbdd7109f54a" }

[dev-dependencies]
tempfile = "3"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
